<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crave Details | Detalles Hechos a Mano</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Playfair Display', 'serif'],
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              funny: ['Fredoka', 'sans-serif'],
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function() {
        const tituloOriginal = "Crave Details | Detalles Hechos a Mano";
        const mensajes = ["¡Vuelve! 💖", "No te vayas aún... 🥺", "Tenemos cositas nuevas ✨"];
        let intervaloId = null;
        let indice = 0;

        document.addEventListener("visibilitychange", function() {
          if (document.hidden) {
            // El usuario cambió de pestaña: empieza a intercalar mensajes
            intervaloId = setInterval(function() {
              document.title = mensajes[indice];
              indice = (indice + 1) % mensajes.length;
            }, 2000); // Intercala cada 2 segundos
          } else {
            // El usuario regresó: se limpia el efecto y vuelve el título original
            clearInterval(intervaloId);
            document.title = tituloOriginal;
          }
        });
      })();
    </script>
  </body>
</html>
